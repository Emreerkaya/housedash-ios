name: HouseDash
options:
  bundleIdPrefix: com.housedash
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  DesignSystem:
    path: Packages/DesignSystem
  Networking:
    path: Packages/Networking
  Features:
    path: Packages/Features

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  HouseDash:
    type: application
    platform: iOS
    sources:
      - path: App/HouseDash
    info:
      path: Generated/HouseDash-Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - ZillaSlab-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.housedash.app
        PRODUCT_NAME: HouseDash
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: DesignSystem
      - package: Networking
      - package: Features

  HouseDashTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HouseDashTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.housedash.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: HouseDash
      - package: DesignSystem
      - package: Features

  HouseDashUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HouseDashUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.housedash.app.uitests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: HouseDash

schemes:
  HouseDash:
    build:
      targets:
        HouseDash: all
        HouseDashTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HouseDashTests

  HouseDashUITests:
    build:
      targets:
        HouseDash: all
        HouseDashUITests: [test]
    test:
      config: Debug
      targets:
        - HouseDashUITests
